[project]
name = "indraocr-liteparse"
version = "0.1.0"
description = "Indra OCR server implementing the LiteParse OCR API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.131.0",
    "indra-ocr==1.1.2",
    "numpy>=2.4.2",
    "pillow>=12.1.1",
    "python-multipart>=0.0.22",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
